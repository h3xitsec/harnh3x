[tool.poetry]
name = "h3x-harness"
version = "0.1.0"
description = "Experimentation on building a custom AI harness"
authors = ["h3xit <connect@h3x.it>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
openai = "3.24.0"
python-dotenv = "1.2.4"
textual = "^8.2.0"
trafilatura = "^2.3.0"
pypdf = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
